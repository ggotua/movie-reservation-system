[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "movie-reservation-system-backend"
version = "0.1.0"
description = "Backend service for the Movie Reservation System."
requires-python = ">=3.13"

# Backend dependencies. pytest / pytest-asyncio / httpx / ruff / mypy are
# the test-and-quality-gate tooling; they live in this single list to match
# the scaffold specification. All backend commands (venv, pytest, alembic,
# uvicorn) are run from `backend/` and Python imports stay `src.<module>`.
dependencies = [
    "fastapi",
    "uvicorn",
    # NOTE: the `asyncio` extra pulls in greenlet, which sqlalchemy.ext.asyncio
    # imports at load time. Plain "sqlalchemy>=2.0" installs without it, so
    # every async engine import (src/db/engine.py, the seed, tests) fails.
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "psycopg[binary]",
    "pydantic[email]>=2",
    # NOTE: pydantic-settings is required to use Pydantic v2 BaseSettings
    # (the Settings class in src/core/config.py). It is not part of the
    # original scaffold list but the config module cannot import without it.
    "pydantic-settings",
    "pyjwt",
    # NOTE: bcrypt is used directly (hashpw/checkpw) rather than through
    # passlib — passlib's last release was 2020 and its bcrypt backend raises
    # against bcrypt 5.x (see docs/steering/tech-stack.md, PROMPT 4b). Pinned
    # below 6 so a future major cannot silently change the hash format.
    "bcrypt>=5.0,<6",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
]

# The importable package is the top-level `src/` directory (imports are
# `src.core...`, `src.db...`), so exactly that tree is packaged.
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
# Imports are `src.<module>` with no per-package __init__.py files, so tell
# mypy to treat `src/` as a package base (run from `backend/`) instead of
# inferring a top-level module name per file.
mypy_path = "."
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
