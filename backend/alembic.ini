# Alembic configuration for the Movie Reservation System backend.
#
# Commands are run from backend/ (see docs/steering/conventions.md):
#     alembic upgrade head
#     alembic downgrade base
#     alembic revision -m "message"     # new migration (uses script.py.mako)
#
# The database URL is deliberately NOT set here. migrations/env.py reads it
# from src/core/config.py (the DATABASE_URL setting) so there is a single
# source of truth and no credentials are ever committed to this file.

[alembic]
# Path to the migration environment, relative to this file.
script_location = migrations
# Make `src` importable when alembic is invoked from backend/ (env.py also
# prepends the backend directory defensively, so this works from the repo
# root too).
prepend_sys_path = .

# Use the OS path separator when splitting prepend_sys_path. Without this,
# Alembic falls back to legacy space/comma/colon splitting and emits a
# DeprecationWarning.
path_separator = os

# Use the OS path separator when splitting version_locations.
version_path_separator = os

# Left empty on purpose: env.py supplies the URL from Settings.database_url.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
